name: Railway Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.41.2

      - name: Deploy to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured for the production environment; skipping deploy."
            exit 0
          fi
          PROJECT_ID="${RAILWAY_PROJECT_ID:-1aebfacb-3335-4597-90aa-32fc3d280c1d}"
          SERVICE_NAME="${RAILWAY_SERVICE_NAME:-swift}"
          ENVIRONMENT_NAME="${RAILWAY_ENVIRONMENT_NAME:-production}"
          railway up --project "$PROJECT_ID" --service "$SERVICE_NAME" --environment "$ENVIRONMENT_NAME" -y --ci
