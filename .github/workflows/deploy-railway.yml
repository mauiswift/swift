name: Railway Deploy

on:
  push:
    branches: [ main, korea ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: philippines
            project_id: 2a5d329d-74b2-438d-96c5-b55deec65e8
            service_name: swift
          - name: korea
            project_id: 6258a878-5973-499c-b0af-98565c4023bd
            service_name: swift
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.41.2

      - name: Deploy to Railway (${{ matrix.name }})
        if: github.ref == 'refs/heads/main' || matrix.name == 'korea'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ matrix.project_id }}
          RAILWAY_SERVICE_NAME: ${{ matrix.service_name }}
          RAILWAY_ENVIRONMENT_NAME: ${{ vars.RAILWAY_ENVIRONMENT_NAME }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "ERROR: RAILWAY_TOKEN is not configured for the production environment." >&2
            exit 1
          fi
          PROJECT_ID="${RAILWAY_PROJECT_ID}"
          SERVICE_NAME="${RAILWAY_SERVICE_NAME:-swift}"
          ENVIRONMENT_NAME="${RAILWAY_ENVIRONMENT_NAME:-production}"
          railway up --project "$PROJECT_ID" --service "$SERVICE_NAME" --environment "$ENVIRONMENT_NAME" -y --ci
