# Render deployment config for xend
# Adjust branch, plan, and secret management as needed in Render dashboard.

services:
  - type: web
    name: paybot-backend
    env: docker
    plan: starter
    repo: https://github.com/PayBot-PH/paybot
    branch: main
    dockerfilePath: Dockerfile
    autoDeploy: true
    instances: 1
    healthCheckPath: /health
    envVars:
      - key: SWIFTPAY_ACCESS_KEY
        value: replace-with-production-swiftpay-access-key
      - key: SWIFTPAY_SECRET_KEY
        value: replace-with-production-swiftpay-secret-key
      - key: SWIFTPAY_MODE
        value: production
      - key: SWIFTPAY_CALLBACK_URL
        value: https://your-domain.example/api/v1/swiftpay/callback
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_BACKEND_URL
        value: https://your-domain.example
      - key: ENVIRONMENT
        value: production

databases:
  - name: paybot-db
    plan: starter

jobs:
  - name: migrate-database
    type: job
    env: docker
    plan: starter
    repo: https://github.com/PayBot-PH/paybot
    branch: main
    dockerfilePath: Dockerfile
    command: alembic -c backend/alembic.ini upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
