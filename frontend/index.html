<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftPay - Payment Dashboard</title>
    <meta property="og:title" content="SwiftPay - Payment Dashboard" />
    <meta name="author" content="SwiftPay" />
    <style>
      /* Force dark background immediately */
      html, body { background: #0f172a; margin: 0; padding: 0; color: white; font-family: 'Inter', system-ui, -apple-system, sans-serif; height: 100%; width: 100%; }

      /* ──── SwiftPay Zendesk Widget Customization ──── */
      /* Override Zendesk default styling to match SwiftPay brand */
      
      /* Frame/Container Styling */
      .zEWidget-launcher,
      .ze-launcher {
        background: linear-gradient(135deg, #0b63ff 0%, #0052cc 100%) !important;
        border-radius: 50% !important;
        box-shadow: 0 4px 20px rgba(11, 99, 255, 0.4), 0 8px 24px rgba(0, 0, 0, 0.2) !important;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      }

      .zEWidget-launcher:hover,
      .ze-launcher:hover {
        transform: scale(1.1) !important;
        box-shadow: 0 6px 28px rgba(11, 99, 255, 0.5), 0 12px 32px rgba(0, 0, 0, 0.25) !important;
      }

      .zEWidget-launcher:active,
      .ze-launcher:active {
        transform: scale(0.95) !important;
      }

      /* Widget Header */
      .zEWidget-header,
      .ze-form-header,
      .zEtabDesktopHeader {
        background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%) !important;
        border-bottom: 1px solid #333333 !important;
        color: #ffffff !important;
      }

      /* Widget Title */
      .zEWidget-header-title,
      .ze-form-title,
      .zEtabDesktop_heading {
        color: #ffffff !important;
        font-weight: 700 !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }

      /* Widget Body */
      .zEWidget-formWrapper,
      .ze-form-container,
      .zEtabDesktop_content {
        background: #ffffff !important;
        color: #000000 !important;
      }

      /* Form Inputs */
      .zEWidget-input,
      .ze-form-input,
      input[class*="ze"],
      textarea[class*="ze"],
      .zEWidget-textInput,
      .zEWidget-textareaInput {
        background: #f9fafb !important;
        border: 1px solid #e5e7eb !important;
        color: #000000 !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }

      .zEWidget-input:focus,
      .ze-form-input:focus,
      input[class*="ze"]:focus,
      textarea[class*="ze"]:focus,
      .zEWidget-textInput:focus,
      .zEWidget-textareaInput:focus {
        border-color: #0b63ff !important;
        box-shadow: 0 0 0 3px rgba(11, 99, 255, 0.1) !important;
        outline: none !important;
      }

      /* Labels */
      .zEWidget-label,
      .ze-form-label,
      label[class*="ze"] {
        color: #1f2937 !important;
        font-weight: 600 !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }

      /* Submit Button */
      .zEWidget-submit,
      .ze-form-submit,
      button[class*="ze-submit"],
      .zEWidget-sendBtn {
        background: linear-gradient(135deg, #0b63ff 0%, #0052cc 100%) !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: 8px !important;
        font-weight: 600 !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
        transition: all 0.3s ease !important;
        cursor: pointer !important;
        padding: 10px 20px !important;
      }

      .zEWidget-submit:hover,
      .ze-form-submit:hover,
      button[class*="ze-submit"]:hover,
      .zEWidget-sendBtn:hover {
        background: linear-gradient(135deg, #1e7fff 0%, #003d99 100%) !important;
        box-shadow: 0 4px 16px rgba(11, 99, 255, 0.3) !important;
        transform: translateY(-2px) !important;
      }

      .zEWidget-submit:active,
      .ze-form-submit:active,
      button[class*="ze-submit"]:active,
      .zEWidget-sendBtn:active {
        transform: translateY(0) !important;
      }

      /* Widget Footer */
      .zEWidget-footer,
      .ze-form-footer,
      .zEtabDesktop_footer {
        background: #f9fafb !important;
        border-top: 1px solid #e5e7eb !important;
      }

      /* Links */
      a[class*="ze"],
      .zEWidget-link,
      .ze-link {
        color: #0b63ff !important;
        text-decoration: none !important;
        transition: all 0.2s ease !important;
      }

      a[class*="ze"]:hover,
      .zEWidget-link:hover,
      .ze-link:hover {
        color: #0052cc !important;
        text-decoration: underline !important;
      }

      /* Tab Styling */
      .zEWidget-tab,
      .ze-tab,
      .zEtabDesktop_tab {
        background: #f3f4f6 !important;
        color: #4b5563 !important;
        border-bottom: 2px solid transparent !important;
        transition: all 0.2s ease !important;
      }

      .zEWidget-tab.active,
      .ze-tab.active,
      .zEtabDesktop_tab.active {
        background: #ffffff !important;
        color: #0b63ff !important;
        border-bottom-color: #0b63ff !important;
      }

      /* Close Button */
      .zEWidget-closeButton,
      .ze-close-button,
      button[class*="ze-close"] {
        color: #6b7280 !important;
        background: transparent !important;
        transition: all 0.2s ease !important;
      }

      .zEWidget-closeButton:hover,
      .ze-close-button:hover,
      button[class*="ze-close"]:hover {
        color: #000000 !important;
        background: #e5e7eb !important;
      }

      /* Message Bubbles */
      .zEWidget-bubble,
      .ze-message,
      .zEtabDesktop_message {
        border-radius: 12px !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      }

      /* Agent Message */
      .zEWidget-agentMessage,
      .ze-agent-message,
      .zEtabDesktop_agentMessage {
        background: #e5e7eb !important;
        color: #000000 !important;
      }

      /* User Message */
      .zEWidget-visitorMessage,
      .ze-visitor-message,
      .zEtabDesktop_visitorMessage {
        background: linear-gradient(135deg, #0b63ff 0%, #0052cc 100%) !important;
        color: #ffffff !important;
      }

      /* Loading State */
      .zEWidget-loading,
      .ze-loading {
        color: #0b63ff !important;
      }

      .zEWidget-spinner,
      .ze-spinner {
        border-color: rgba(11, 99, 255, 0.2) !important;
        border-top-color: #0b63ff !important;
      }

      /* Scrollbar Styling */
      .zEWidget-scroll::-webkit-scrollbar,
      .ze-scroll::-webkit-scrollbar {
        width: 8px;
      }

      .zEWidget-scroll::-webkit-scrollbar-track,
      .ze-scroll::-webkit-scrollbar-track {
        background: #f3f4f6;
      }

      .zEWidget-scroll::-webkit-scrollbar-thumb,
      .ze-scroll::-webkit-scrollbar-thumb {
        background: #0b63ff;
        border-radius: 4px;
      }

      .zEWidget-scroll::-webkit-scrollbar-thumb:hover,
      .ze-scroll::-webkit-scrollbar-thumb:hover {
        background: #0052cc;
      }

      /* Animation on Launcher Appearance */
      @keyframes zendesk-pulse {
        0%, 100% { box-shadow: 0 4px 20px rgba(11, 99, 255, 0.4), 0 8px 24px rgba(0, 0, 0, 0.2); }
        50% { box-shadow: 0 4px 24px rgba(11, 99, 255, 0.6), 0 12px 32px rgba(0, 0, 0, 0.25); }
      }

      .zEWidget-launcher.first-visit,
      .ze-launcher.first-visit {
        animation: zendesk-pulse 2s ease-in-out 3 !important;
      }

      /* Mobile Responsiveness */
      @media (max-width: 640px) {
        .zEWidget-launcher,
        .ze-launcher {
          bottom: 16px !important;
          right: 16px !important;
        }

        .zEWidget-contentWrapper,
        .ze-content-wrapper {
          max-width: 90vw !important;
        }
      }

      /* Dark Mode Support */
      @media (prefers-color-scheme: dark) {
        .zEWidget-formWrapper,
        .ze-form-container {
          background: #1f2937 !important;
          color: #ffffff !important;
        }

        .zEWidget-input,
        .ze-form-input,
        input[class*="ze"],
        textarea[class*="ze"] {
          background: #374151 !important;
          border-color: #4b5563 !important;
          color: #ffffff !important;
        }

        .zEWidget-label,
        .ze-form-label {
          color: #e5e7eb !important;
        }

        .zEWidget-tab,
        .ze-tab {
          background: #374151 !important;
          color: #9ca3af !important;
        }

        .zEWidget-agentMessage,
        .ze-agent-message {
          background: #374151 !important;
          color: #ffffff !important;
        }
      }
    </style>
    <!-- Start of swiftpayventuresinchelp Zendesk Widget script -->
    <script id="ze-snippet" src="https://static.zdassets.com/ekr/snippet.js?key=374c070d-1dd7-4b49-9114-6d3ebeb26f87"> </script>
    <!-- End of swiftpayventuresinchelp Zendesk Widget script -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Script path is absolute to prevent relative resolution issues on nested routes -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
