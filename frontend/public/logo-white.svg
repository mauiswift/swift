<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" viewBox="0 0 320 64" role="img" aria-label="SwiftPay logo (white)">
  <defs>
    <style>
      .wordmark { font-family: Inter, -apple-system, system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 32px; }
      .mark { fill: #fff; }
    </style>
  </defs>

  <!-- Mark (seven dots) -->
  <g transform="translate(8,6)" class="mark">
    <circle cx="24" cy="6" r="5" />
    <circle cx="12" cy="18" r="5" />
    <circle cx="36" cy="18" r="5" />
    <circle cx="24" cy="30" r="5" />
    <circle cx="12" cy="42" r="5" />
    <circle cx="36" cy="42" r="5" />
    <circle cx="24" cy="54" r="5" />
  </g>

  <!-- Wordmark -->
  <text x="84" y="42" class="wordmark" fill="#fff">SwiftPay</text>
</svg>
