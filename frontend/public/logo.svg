<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64" role="img" aria-label="SwiftPay logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FECDA5" />
      <stop offset="1" stop-color="#FFB97A" />
    </linearGradient>
    <style>
      .wordmark { font-family: Inter, -apple-system, system-ui, Roboto, "Helvetica Neue", Arial; font-weight: 800; font-size: 28px; }
      .logomark { fill: url(#g); }
      .dot { fill: #0f172a; }
    </style>
  </defs>

  <!-- Logomark: rounded square with stylized S -->
  <g transform="translate(8,6)">
    <rect x="0" y="0" width="52" height="52" rx="12" class="logomark" />
    <path d="M18 16c3-3 8-3 11 0s3 8 0 11c-3 3-8 3-11 0s-3-8 0-11z" transform="translate(4,4) scale(1.4)" fill="#fff" opacity="0.95" />
  </g>

  <!-- Wordmark -->
  <text x="78" y="40" class="wordmark" fill="#0f172a">Swift<span class="dot">Pay</span></text>
</svg>
